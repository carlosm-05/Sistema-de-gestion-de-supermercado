<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="FormGenerico(fields, formAction, formMethod, submitLabel, backUrl)">
      <form th:action="@{${formAction}}" th:method="${formMethod}" class="form-card">

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:each="field : ${fields}" class="form-group">
          <label th:for="${field.name}" th:text="${field.label}"></label>

          <!-- textarea -->
          <textarea
            th:if="${field.type == 'textarea'}"
            th:id="${field.name}"
            th:name="${field.name}"
            th:required="${field.required}"
            th:attr="${field.extraAttrs}"
            class="form-control"
            rows="3"
            th:text="${field.value}"></textarea>

          <!-- select -->
          <select
            th:if="${field.type == 'select'}"
            th:id="${field.name}"
            th:name="${field.name}"
            th:required="${field.required}"
            th:attr="${field.extraAttrs}"
            class="form-control">
            <option value="">-- Seleccionar --</option>
            <option
              th:each="opt : ${field.options}"
              th:value="${opt.value}"
              th:text="${opt.label}"
              th:selected="${opt.value == field.value}">
            </option>
          </select>

          <!-- input normal (text, number, email, etc.) -->
          <input
            th:if="${field.type != 'textarea' and field.type != 'select'}"
            th:type="${field.type}"
            th:id="${field.name}"
            th:name="${field.name}"
            th:value="${field.value}"
            th:required="${field.required}"
            th:attr="${field.extraAttrs}"
            class="form-control"
            step="any"/>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" th:text="${submitLabel}">Guardar</button>
          <a th:href="@{${backUrl}}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </body>
</html>
