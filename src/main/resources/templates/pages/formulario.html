<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/plantilla}"
>
  <body>
    <th:block layout:fragment="content">

      <div class="page-header">
        <h1 th:text="${pageTitle}">Formulario</h1>
      </div>

      <div th:replace="~{fragments/formulario :: FormGenerico(
        ${fields},
        ${formAction},
        ${formMethod ?: 'post'},
        ${submitLabel},
        ${backUrl}
      )}"></div>

    </th:block>
  </body>
</html>
