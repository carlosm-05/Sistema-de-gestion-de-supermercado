<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión - Supermercado</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <h1>Supermercado</h1>
        <p class="login-subtitle">Iniciar Sesión</p>

        <form th:action="@{/login}" method="post">
          <div th:if="${param.error}" class="login-error">
            Usuario o contraseña incorrectos
          </div>
          <div th:if="${param.logout}" class="login-msg">
            Sesión cerrada correctamente
          </div>

          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus/>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required/>
          </div>
          <button type="submit" class="btn btn-primary login-btn">Entrar</button>
        </form>

        <div class="login-register">
          <span>¿No tienes cuenta?</span>
          <a th:href="@{/registrar}">Crear cuenta</a>
        </div>
      </div>
    </div>
  </body>
</html>
