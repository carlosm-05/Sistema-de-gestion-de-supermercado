<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Crear Cuenta - Supermercado</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <h1>Supermercado</h1>
        <p class="login-subtitle">Crear Cuenta</p>

        <div th:if="${error}" class="login-error" th:text="${error}"></div>
        <div th:if="${success}" class="login-msg" th:text="${success}"></div>

        <form th:action="@{/registrar}" method="post">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required maxlength="100"/>
          </div>
          <div class="form-group">
            <label for="posicion">Cargo</label>
            <input type="text" id="posicion" name="posicion" class="form-control" required maxlength="100"/>
          </div>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required minlength="3" maxlength="50"/>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required minlength="4" maxlength="255"/>
          </div>
          <button type="submit" class="btn btn-primary login-btn">Crear cuenta</button>
        </form>

        <div class="login-register">
          <span>¿Ya tienes cuenta?</span>
          <a th:href="@{/login}">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </body>
</html>
